name: Cache kernel.org tarballs to GitHub CDN

on:
  schedule:
    - cron: '0 3 * * *'   # daily UTC 03:00
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  RELEASE_TAG: kernel-sources

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Determine versions to cache
        id: vers
        run: |
          set -euo pipefail
          json=$(curl -sfL --max-time 60 https://www.kernel.org/releases.json)
          # one latest x.y.z version per major.minor branch (skip mainline/next),
          # only branches actually consumed by the repo PKGBUILDs (>= 6.6)
          versions=$(echo "$json" | jq -r '
            [.releases[].version]
            | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))
            | map({major: (split(".")[0:2] | join(".")), v: .})
            | group_by(.major)
            | map(.[0].v)
            | map(select((split(".")[0]|tonumber) > 6 or ((split(".")[0]|tonumber) == 6 and (split(".")[1]|tonumber) >= 6)))
            | join(" ")')
          echo "versions=$versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

      - name: Download tarballs
        run: |
          set -euo pipefail
          mkdir -p tarballs
          versions="${{ steps.vers.outputs.versions }}"
          echo "下载项: $versions"
          for version in $versions; do
            major="${version%%.*}"
            url="https://www.kernel.org/pub/linux/kernel/v${major}.x/linux-${version}.tar.xz"
            fname="linux-${version}.tar.xz"
            if [ -f "tarballs/$fname" ]; then
              echo "跳过已存在的 $fname"
              continue
            fi
            echo "=== 下载 $fname ($url) ==="
            curl -sfL --retry 10 --retry-delay 30 --connect-timeout 30 --max-time 600 \
              "$url" -o "tarballs/$fname" || {
              echo "::warning::下载 $fname 失败，跳过"
              continue
            }
            ls -lh "tarballs/$fname"
          done

      - name: Publish release
        if: hashFiles('tarballs/*') != ''
        run: |
          set -euo pipefail
          echo "待上传: $(ls tarballs/)"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
            echo "已删除旧 release"
          fi
          gh release create "$RELEASE_TAG" tarballs/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "kernel.org tarball cache" \
            --notes "Autogenerated from kernel.org/releases.json on $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Release $RELEASE_TAG 已创建"