name: Cache kernel.org tarballs to GitHub CDN

on:
  schedule:
    - cron: '0 3 * * *'   # daily UTC 03:00
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  RELEASE_TAG: kernel-sources

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Determine versions to cache
        id: vers
        run: |
          set -euo pipefail
          json=$(curl -sfL --max-time 60 https://www.kernel.org/releases.json)
          # one latest x.y.z version per major.minor branch (skip mainline/next),
          # only branches actually consumed by the repo PKGBUILDs (>= 6.6)
          versions=$(echo "$json" | jq -r '
            [.releases[].version]
            | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))
            | map({major: (split(".")[0:2] | join(".")), v: .})
            | group_by(.major)
            | map(.[0].v)
            | map(select((split(".")[0]|tonumber) > 6 or ((split(".")[0]|tonumber) == 6 and (split(".")[1]|tonumber) >= 6)))
            | join(" ")')
          echo "versions=$versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

      - name: Download tarballs
        run: |
          set -euo pipefail
          mkdir -p tarballs
          versions="${{ steps.vers.outputs.versions }}"
          echo "下载项: $versions"
          for version in $versions; do
            major="${version%%.*}"
            fname="linux-${version}.tar.xz"
            out="tarballs/$fname"
            if [ -f "$out" ]; then
              echo "跳过已存在的 $fname"
              continue
            fi
            ok=false
            # cdn.kernel.org is the Fastly-backed mirror; www.kernel.org 302s to
            # it anyway but resets large transfers far more often.
            for base in https://cdn.kernel.org/pub/linux/kernel https://www.kernel.org/pub/linux/kernel; do
              url="$base/v${major}.x/$fname"
              echo "=== 下载 $fname ($url) ==="
              # -C - resumes a partial file, so a reset costs only the remainder
              if curl -fL --retry 10 --retry-delay 20 --retry-all-errors \
                   --connect-timeout 30 --speed-time 60 --speed-limit 10240 \
                   -C - "$url" -o "$out"; then
                ok=true
                break
              fi
              echo "$base 失败，换下一个镜像"
            done
            if [ "$ok" != true ] || [ "$(stat -c%s "$out" 2>/dev/null || echo 0)" -lt 50000000 ]; then
              # a truncated file must not reach the release, it would poison
              # every consumer's checksum check
              echo "::warning::下载 $fname 失败或不完整，删除并跳过"
              rm -f "$out"
              continue
            fi
            ls -lh "$out"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(ls -A tarballs 2>/dev/null)" ]; then
            echo "::error::一个 tarball 都没下载到"
            exit 1
          fi
          echo "待上传:"; ls -lh tarballs/
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            echo "已删除旧 release"
          fi
          gh release create "$RELEASE_TAG" tarballs/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "kernel.org tarball cache" \
            --notes "Autogenerated from kernel.org/releases.json on $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Release $RELEASE_TAG 已创建"