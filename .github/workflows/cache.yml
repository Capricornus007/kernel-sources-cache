name: Cache kernel.org tarballs to GitHub CDN

on:
  schedule:
    - cron: '0 3 * * *'   # daily UTC 03:00
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific version to cache (e.g. 6.12.107)'
        required: false

permissions:
  contents: write

env:
  RELEASE_TAG: kernel-sources

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Determine versions to cache
        id: vers
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}"
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch the latest versions from kernel.org for all relevant branches
          json=$(curl -sfL --max-time 60 https://www.kernel.org/releases.json)
          versions=$(echo "$json" | python3 -c "
import json, sys
d = json.load(sys.stdin)
# Collect versions grouped by major branch
# (stable=latest stable, longterm for LTS lines)
by_branch = {}
for rel in d.get('releases', []):
    v = rel['version']
    major = '.'.join(v.split('.')[:2])
    by_branch[major] = v
# Order: 7.2, 7.1, 6.18, 6.12, 6.6 — whatever kernel.org publishes
for k in sorted(by_branch, key=lambda x: tuple(map(int, x.split('.'))), reverse=True):
    print(by_branch[k])
")
          all_versions=$(echo "$versions" | tr '\n' ' ')
          echo "versions=$all_versions"
          echo "versions=$all_versions" >> "$GITHUB_OUTPUT"

      - name: Download tarballs
        run: |
          set -euo pipefail
          mkdir -p tarballs
          for version in ${{ steps.vers.outputs.versions }}; do
            major="${version%%.*}"
            url="https://www.kernel.org/pub/linux/kernel/v${major}.x/linux-${version}.tar.xz"
            fname="linux-${version}.tar.xz"
            echo "=== 下载 $fname ==="
            # Heavy retry: curl --retry 10 with long timeouts
            curl -sfL --retry 10 --retry-delay 30 --connect-timeout 30 --max-time 600 \
              "$url" -o "tarballs/$fname" || {
              echo "::warning::下载 $fname 失败，跳过"
              continue
            }
            ls -lh "tarballs/$fname"
          done
          ls -lh tarballs/ | head -20

      - name: Publish release
        run: |
          set -euo pipefail
          if [ ! -d tarballs ] || [ -z "$(ls tarballs/ 2>/dev/null)" ]; then
            echo "没有下载到任何 tarball"
            exit 0
          fi
          # Delete old release if it exists, create new one
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$RELEASE_TAG" tarballs/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "kernel.org tarball cache" \
            --notes "Automatically generated by GitHub Actions CI. Source: kernel.org/pub/linux/kernel/"
          echo "已发布: $(ls tarballs/)"